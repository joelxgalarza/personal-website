<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peptide Reference</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0f0f0;
    --muted: #777;
    --dim: #444;
    --accent: #c8f56a;
    --accent-dim: rgba(200,245,106,0.12);
    --accent-text: #0a0a0a;
    --red: #ff6b6b;
    --red-dim: rgba(255,107,107,0.1);
    --amber: #ffc94d;
    --amber-dim: rgba(255,201,77,0.1);
    --blue: #6bc5ff;
    --blue-dim: rgba(107,197,255,0.1);
    --teal: #4dffd2;
    --teal-dim: rgba(77,255,210,0.1);
    --purple: #c084fc;
    --purple-dim: rgba(192,132,252,0.1);
    --coral: #ff8c69;
    --coral-dim: rgba(255,140,105,0.1);
    --pink: #ff85c8;
    --pink-dim: rgba(255,133,200,0.1);
    --green: #69db7c;
    --green-dim: rgba(105,219,124,0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* Header */
  header {
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(12px);
    z-index: 100;
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .header-meta {
    font-size: 11px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  /* Layout */
  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: calc(100vh - 60px);
  }

  /* Sidebar */
  .sidebar {
    border-right: 1px solid var(--border);
    padding: 20px 0;
    position: sticky;
    top: 60px;
    height: calc(100vh - 60px);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border2) transparent;
  }

  .search-wrap {
    padding: 0 16px 16px;
    border-bottom: 1px solid var(--border);
  }

  .search-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 9px 12px 9px 34px;
    color: var(--text);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }

  .search-icon {
    position: absolute;
    left: 26px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 13px;
    pointer-events: none;
  }

  .search-wrap { position: relative; }

  .cat-section { padding: 16px 0; }

  .cat-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    padding: 0 16px;
    margin-bottom: 6px;
  }

  .cat-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 7px 16px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    text-align: left;
    transition: color 0.15s, background 0.15s;
    border-left: 2px solid transparent;
  }

  .cat-btn:hover { color: var(--text); background: var(--surface2); }
  .cat-btn.active { color: var(--accent); border-left-color: var(--accent); background: var(--accent-dim); }

  .cat-count {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--dim);
  }

  .cat-btn.active .cat-count { color: var(--accent); opacity: 0.7; }

  /* Main content */
  .main {
    padding: 24px;
    max-width: 900px;
  }

  .results-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .results-count {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .sort-select {
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 6px 10px;
    color: var(--text);
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    cursor: pointer;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .card:hover { border-color: var(--border2); }
  .card.open { border-color: var(--border2); }

  .card-head {
    display: flex;
    align-items: center;
    padding: 14px 18px;
    cursor: pointer;
    gap: 12px;
    user-select: none;
  }

  .card-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .card-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
    line-height: 1.3;
  }

  .card-cat {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    font-family: 'Space Mono', monospace;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .chevron {
    color: var(--dim);
    font-size: 10px;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .card.open .chevron { transform: rotate(180deg); }

  /* Card body */
  .card-body {
    display: none;
    padding: 0 18px 18px;
    border-top: 1px solid var(--border);
  }
  .card.open .card-body { display: block; }

  .section {
    margin-top: 16px;
  }

  .section-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .mechanism-text {
    font-size: 13px;
    color: #aaa;
    line-height: 1.7;
    background: var(--surface2);
    padding: 12px 14px;
    border-radius: 6px;
    border-left: 2px solid var(--border2);
  }

  .pills { display: flex; flex-wrap: wrap; gap: 6px; }

  .pill {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 5px;
    line-height: 1.4;
  }

  .pill-benefit {
    background: var(--green-dim);
    color: var(--green);
    border: 1px solid rgba(105,219,124,0.2);
  }

  .pill-drawback {
    background: var(--red-dim);
    color: var(--red);
    border: 1px solid rgba(255,107,107,0.2);
  }

  .disclaimer {
    margin-top: 16px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 6px;
    font-size: 11px;
    color: var(--dim);
    line-height: 1.5;
  }

  /* Category color map */
  .dot-teal { background: var(--teal); }
  .dot-purple { background: var(--purple); }
  .dot-blue { background: var(--blue); }
  .dot-green { background: var(--green); }
  .dot-amber { background: var(--amber); }
  .dot-coral { background: var(--coral); }
  .dot-pink { background: var(--pink); }
  .dot-red { background: var(--red); }
  .dot-gray { background: var(--muted); }

  .tag-teal { background: var(--teal-dim); color: var(--teal); }
  .tag-purple { background: var(--purple-dim); color: var(--purple); }
  .tag-blue { background: var(--blue-dim); color: var(--blue); }
  .tag-green { background: var(--green-dim); color: var(--green); }
  .tag-amber { background: var(--amber-dim); color: var(--amber); }
  .tag-coral { background: var(--coral-dim); color: var(--coral); }
  .tag-pink { background: var(--pink-dim); color: var(--pink); }
  .tag-red { background: var(--red-dim); color: var(--red); }
  .tag-gray { background: rgba(119,119,119,0.1); color: var(--muted); }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 13px;
  }
  .empty-icon { font-size: 32px; margin-bottom: 12px; }

  /* Mobile */
  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar {
      position: static;
      height: auto;
      border-right: none;
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
    }
    .cat-section { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 12px; }
    .cat-btn {
      border-radius: 20px;
      padding: 5px 12px;
      border-left: none;
      font-size: 12px;
      width: auto;
    }
    .cat-btn.active { border-left: none; }
    .cat-label { display: none; }
    .main { padding: 16px; }
    header { padding: 0 16px; }
    .header-meta { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Peptide Ref</div>

</div>

const compounds = [
  { name:"Tirzepatide", cat:"GLP-1 / Weight Loss", mechanism:"Dual GIP and GLP-1 receptor agonist. Stimulates insulin secretion, suppresses glucagon, slows gastric emptying, and reduces appetite via central and peripheral pathways.", benefits:["Major weight loss (up to 20-22% body weight in trials)","Type 2 diabetes management","Improved insulin sensitivity","Cardiovascular risk reduction","Lower triglycerides and blood pressure"], drawbacks:["Nausea, vomiting, diarrhea (common early on)","Constipation","Pancreatitis risk","Possible thyroid C-cell tumors (rodent data)","Expensive; requires prescription","Muscle loss if not paired with resistance training"] },

const catList = ["All", ...Object.keys(CAT_COLOR)].filter((v,i,a) => a.indexOf(v) === i);
let activeCat = "All";
let openCards = new Set();

function getCatColor(cat) { return CAT_COLOR[cat] || "gray"; }

function buildSidebar() {
  const counts = {};
  compounds.forEach(c => { counts[c.cat] = (counts[c.cat]||0)+1; });
  const el = document.getElementById("cats");
  el.innerHTML = `<div class="cat-label">Categories</div>` +
    catList.filter(c => c === "All" || counts[c]).map(c => {
      const col = getCatColor(c);
      const cnt = c === "All" ? compounds.length : (counts[c]||0);
      return `<button class="cat-btn${activeCat===c?" active":""}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">
        <span>${c}</span>
        <span class="cat-count">${cnt}</span>
      </button>`;
    }).join("");
}

function render() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  const filtered = compounds.filter(c => {
    const matchCat = activeCat === "All" || c.cat === activeCat;
    const matchQ = !q || c.name.toLowerCase().includes(q) || c.cat.toLowerCase().includes(q) || c.mechanism.toLowerCase().includes(q) || c.benefits.some(b=>b.toLowerCase().includes(q)) || c.drawbacks.some(d=>d.toLowerCase().includes(q));
    return matchCat && matchQ;
  });

  document.getElementById("rcount").textContent = filtered.length + " compound" + (filtered.length !== 1 ? "s" : "");
  document.getElementById("hcount").textContent = compounds.length + " compounds";

  if (!filtered.length) {
    document.getElementById("list").innerHTML = `<div class="empty"><div class="empty-icon">○</div>No compounds match your search</div>`;
    return;
  }

  document.getElementById("list").innerHTML = filtered.map((c, i) => {
    const col = getCatColor(c.cat);
    const id = "c" + compounds.indexOf(c);
    const isOpen = openCards.has(id);
    return `
      <div class="card${isOpen?" open":""}" id="${id}">
        <div class="card-head" onclick="toggle('${id}')">
          <div class="card-dot dot-${col}"></div>
          <div class="card-name">${c.name}</div>
          <span class="card-cat tag-${col}">${c.cat}</span>
          <span class="chevron">▼</span>
        </div>
        <div class="card-body">
          <div class="section">
            <div class="section-label">Mechanism</div>
            <div class="mechanism-text">${c.mechanism}</div>
          </div>
          <div class="section">
            <div class="section-label">Benefits</div>
            <div class="pills">${c.benefits.map(b=>`<span class="pill pill-benefit">${b}</span>`).join("")}</div>
          </div>
          <div class="section">
            <div class="section-label">Drawbacks & side effects</div>
            <div class="pills">${c.drawbacks.map(d=>`<span class="pill pill-drawback">${d}</span>`).join("")}</div>
          </div>
          <div class="disclaimer">⚠ Educational reference only. Many compounds listed are not FDA-approved for human use and are research chemicals. Consult a qualified healthcare provider before use.</div>
        </div>
      </div>`;
  }).join("");
}

function toggle(id) {
  if (openCards.has(id)) openCards.delete(id);
  else openCards.add(id);
  render();
}

function setFilter(cat) {
  activeCat = cat;
  buildSidebar();
  render();
}

buildSidebar();
render();
</script>
